[project]
name = "self-modeling-eval"
version = "0.1.0"
description = "Standalone reproduction of the mixed self-modeling eval suite (E1–E10)."
requires-python = ">=3.11"
dependencies = [
    "safetytooling @ git+https://github.com/safety-research/safety-tooling.git@3117839f0cdf5b4a56c8fc00299c199330ee2b2f",
    "math-verify>=0.7.0",
    "datasets>=4.4.2",
    "anthropic>=0.75.0",
    "openai>=2.30",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_attribution"]

[tool.uv]
override-dependencies = [
    "anthropic>=0.75.0",
    "datasets>=4.4.2",
    "openai>=2.30",
    "pydantic>=2.11.4",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src", ".", "scripts"]
